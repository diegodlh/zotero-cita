wikicite.lcn.window.export-modal.ris.title=在参考文献管理器中打开（例如Zotero）
wikicite.lcn.window.faq.citation.content.p1=通过滚动进行缩放，通过拖拽进行平移。每个节点（即顶点）代表一篇条目。它们按年份从上（较新）到下（较旧）排列，不同年份以不同颜色区分。此外，在“网络设置”中，节点也可根据条目所属期刊进行着色。节点大小取决于“被引”（即该论文被种子条目引用的本地入链引用数）与“施引”（即该论文引用的种子条目数，即本地出链引用数）之和。本地引用数并不总是与全局引用数成正比。种子条目以圆形（●）表示。朝上的三角形（▲）代表“高被引条目”，即被种子条目引用的文献。
wikicite.lcn.window.faq.citation.content.p2=每条边（=链接/箭头）代表一条引用：对于其源节点而言是向外引用，对于其目标节点而言则是向内引用。通常论文只能引用更早的文献，因此边往往指向下方（或同年度引用的侧向）。从技术上讲，引用网络是一个有向无环图。
wikicite.lcn.window.faq.citation.header=如何阅读引文网络？
wikicite.lcn.window.faq.coauthorship.content.p1=此“局部”合著网络展示了种子文献中最常见的作者。根据学科不同，多篇文献集中的（合）作者数量可能迅速增至数百人，因此该作者网络仅显示拥有最低种子文献数量（注意：此数量不可与作者通常更高的全球发文总量混淆）的作者。默认的最低种子文献数量设定为仅显示不超过50位作者，但可通过底部的下拉菜单进行调整。
wikicite.lcn.window.faq.coauthorship.content.p2=每个节点（即顶点）代表一位作者。节点大小取决于其合著种子条目的数量，颜色则取决于其参与合著的第一篇或最后一篇种子条目。点击作者可筛选条目表格，按住Ctrl键点击可同时筛选多位作者。拖拽节点可重新排列布局。
wikicite.lcn.window.faq.coauthorship.content.p3=每条边（即链接）代表种子论文中两位作者之间的合作关系，其宽度表示种子论文的数量。点击边可筛选条目表格。
wikicite.lcn.window.faq.coauthorship.header=如何阅读共同作者网络？
