wikicite.lcn.window.export-modal.p1=Os artigos sempre se desduplican dentro das táboas. Exporta as seguintes táboas:
wikicite.lcn.window.export-modal.ris.title=Abrir no xestor de referencias (por exemplo, Zotero)
wikicite.lcn.window.faq.citation.content.p1=Aplica zoom desprazándote coa roda do rato e desprázate arrastrando. Cada nodo (= vértice) representa un artigo. Ordénanse por ano de arriba (os máis novos) a abaixo (os máis antigos), e cada ano ten unha cor diferente. Como alternativa, os nodos tamén se poden colorear segundo a revista do artigo na «configuración de rede». O tamaño dos nodos depende da suma de «Citado», o número de citas locais entrantes que recibiu o artigo dos artigos semente; e «Citas», o número de artigos semente que citan (citas locais saíntes). O número de citas locais non é sempre proporcional ao número de citas globais. Os artigos semente teñen forma de círculo (●). Os triángulos (▲) representan «os máis citados», que son citados polos artigos semente.
wikicite.lcn.window.faq.citation.content.p2=Cada aresta (= ligazón / frecha) representa unha cita: son referencias saíntes dos seus nodos de orixe e citas entrantes dos seus nodos de destino. Normalmente, os artigos só poden citar artigos máis antigos, polo que as arestas tenden a apuntar cara a abaixo (ou cara a un lado no caso das citas do mesmo ano). Tecnicamente, unha rede de citas é un grafo acíclico dirixido.
wikicite.lcn.window.faq.citation.header=Como ler a rede de citas?
wikicite.lcn.window.faq.coauthorship.content.p1=Esta rede de coautoría «local» amosa os autores máis comúns entre os artigos semente. Dependendo da disciplina, o número de (co)autores entre un conxunto de varios artigos pode ascender rapidamente aos centos, polo que esta rede de autores só amosa os autores cun número mínimo de artigos semente (non confundir co seu número global de publicacións, que adoita ser moito maior). O número mínimo predeterminado de artigos semente determínase para que esta rede non mostre máis de 50 autores, pero podes cambialo co menú depregable da parte inferior.
wikicite.lcn.window.faq.coauthorship.content.p2=Cada nodo (= vértice) representa un autor. O tamaño depende do seu número de artigos semente e a cor depende do primeiro ou do último artigo semente do que teñan a coautoría. Preme nos autores para filtrar as táboas dos artigos; fai Ctrl + clic para filtrar por máis dun autor. Arrastra os nodos para reordenalos.
wikicite.lcn.window.faq.coauthorship.content.p3=Cada aresta (= ligazón) representa unha colaboración entre dous autores entre os artigos semente; o ancho indica o número de artigos semente. Preme nas arestas para filtrar as táboas dos artigos.
wikicite.lcn.window.faq.coauthorship.header=Como ler a rede de coautorías?
