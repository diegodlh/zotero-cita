wikicite.lcn.window.faq.citation.content.p1=Približujte rolovaním a posúvajte ťahaním. Každý uzol (= vrchol) predstavuje článok. Sú zoradené podľa roku zhora (novšie) nadol (staršie), pričom každý rok má inú farbu. Prípadne možno uzly vyfarbiť podľa časopisu článku v časti „nastavenia siete“. Veľkosť uzlov závisí od súčtu hodnoty „Citované“ – počtu lokálnych prichádzajúcich citácií, ktoré článok získal od východiskových článkov – a hodnoty „Cituje“ – počtu východiskových článkov, ktoré cituje (lokálne odchádzajúce citácie). Počty lokálnych citácií nie sú vždy úmerné počtom globálnych citácií. Východiskové články majú tvar kruhu (●). Trojuholníky smerujúce nahor (▲) predstavujú „Najcitovanejšie“, ktoré sú citované východiskovými článkami.
wikicite.lcn.window.faq.citation.content.p2=Každá hrana (= spojnica/šípka) predstavuje citáciu: pre svoje zdrojové uzly sú to odchádzajúce citácie a pre cieľové uzly prichádzajúce citácie. Články zvyčajne môžu citovať len staršie články, preto hrany smerujú väčšinou nadol (alebo do strán pri citáciách z toho istého roku). Technicky je citačná sieť orientovaný acyklický graf.
wikicite.lcn.window.faq.citation.header=Ako čítať sieť citácií?
wikicite.lcn.window.faq.coauthorship.content.p1=Táto „lokálna“ sieť spoluautorstva zobrazuje najčastejších autorov medzi východiskovými článkami. V závislosti od odboru môže počet (spolu)autorov v súbore viacerých článkov rýchlo narásť na stovky, a preto táto sieť autorov zobrazuje len autorov s minimálnym počtom východiskových článkov (nezamieňať s ich globálnym počtom publikácií, ktorý je zvyčajne vyšší). Predvolený minimálny počet východiskových článkov je určený tak, aby táto sieť zobrazovala najviac 50 autorov, no možno ho zmeniť pomocou rozbaľovacej ponuky v dolnej časti.
wikicite.lcn.window.faq.coauthorship.content.p2=Každý uzol (= vrchol) predstavuje autora. Jeho veľkosť závisí od počtu jeho východiskových článkov a farba od prvého alebo posledného východiskového článku, ktorý spoluautorsky vytvoril. Kliknutím na autorov filtrujete tabuľky článkov, podržaním Ctrl a kliknutím filtrujete podľa viacerých autorov. Uzly presúvate ťahaním na ich preusporiadanie.
wikicite.lcn.window.faq.coauthorship.content.p3=Každá hrana (= spojnica) predstavuje spoluprácu medzi dvoma autormi v rámci východiskových článkov, pričom šírka udáva počet východiskových článkov. Kliknutím na hrany filtrujete tabuľky článkov.
