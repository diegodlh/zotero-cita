wikicite.prefs.citation-storage-desc=Cita môže uložiť citované údaje buď ako poznámka alebo v dodatočnom poli knihovníckych položok. Odporúčanou možnosťou je uložiť citované údaje v poznámkach, pretože metadatové údaje o citovaní môžu ľahko zmatnúť dodatočné pole. Zmena tohto nastavenia migruje existujúce údaje o citácii na nové miesto uchovávania pre všetky položky v knižnici.
