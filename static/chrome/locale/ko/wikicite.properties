wikicite.lcn.window.all-cited.info=피인용 논문(▲)은 핵심 논문에 의해 인용된 논문, 즉 핵심 논문의 외부 인용 논문에 포함됩니다. 이러한 논문들은 대부분의 핵심 논문보다 오래된 경우가 많습니다. 피인용 논문은 역방향 인용 검색(시간 순서대로 과거로 거슬러 올라가는 검색)을 통해 얻어집니다.
