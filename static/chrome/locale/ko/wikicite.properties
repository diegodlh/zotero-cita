wikicite.lcn.window.faq.citation.content.p1=스크롤하여 확대/축소하고 드래그하여 이동할 수 있습니다. 각 노드(= 정점)는 논문을 나타냅니다. 논문들은 최신 논문부터 오래된 논문 순으로 연도별로 정렬되어 있으며, 각 연도별로 색상이 다릅니다. 또는 '네트워크 설정'에서 논문이 게재된 저널별로 노드 색상을 지정할 수도 있습니다. 노드의 크기는 해당 논문이 핵심 논문으로부터 받은 로컬 인용 횟수인 '인용된 횟수(Cited)'와 해당 논문이 인용한 핵심 논문의 수인 '인용한 횟수(Citing)'의 합에 따라 결정됩니다. 로컬 인용 횟수는 전체 인용 횟수에 항상 비례하는 것은 아닙니다. 핵심 논문은 원형(●)으로 표시됩니다. 위쪽을 향하는 삼각형(▲)은 핵심 논문에 의해 인용된 '가장 많이 인용된 논문'을 나타냅니다.
wikicite.lcn.window.faq.citation.content.p2=각 간선(링크/화살표)은 인용을 나타냅니다. 이는 출발 노드에 대한 발신 인용과 도착 노드에 대한 수신 인용을 의미합니다. 일반적으로 논문은 자신보다 오래된 논문만 인용할 수 있으므로 간선은 아래쪽(또는 같은 해에 발표된 논문을 인용하는 경우 옆쪽)을 향하는 경향이 있습니다. 기술적으로 인용 네트워크는 방향성 비순환 그래프입니다.
wikicite.lcn.window.faq.citation.header=인용 네트워크를 어떻게 읽어야 하나요?
wikicite.lcn.window.faq.coauthorship.content.p1=이 '로컬' 공동 저자 네트워크는 핵심 논문들에서 가장 많이 공동으로 참여한 저자들을 보여줍니다. 학문 분야에 따라 여러 논문에 참여하는 (공동) 저자의 수는 수백 명에 이를 수 있으므로, 이 저자 네트워크는 최소 기준 이상의 핵심 논문 참여 횟수를 충족하는 저자만 표시합니다(전체 논문 수와는 다르며, 전체 논문 수는 일반적으로 더 많습니다). 기본 최소 핵심 논문 참여 횟수는 이 네트워크에 최대 50명의 저자만 표시되도록 설정되어 있지만, 하단의 드롭다운 메뉴를 통해 변경할 수 있습니다.
wikicite.lcn.window.faq.coauthorship.content.p2=각 노드(= 정점)는 저자를 나타냅니다. 노드의 크기는 해당 저자가 공동 저술한 핵심 논문의 수에 따라 달라지며, 색상은 공동 저술한 첫 번째 또는 마지막 핵심 논문에 따라 결정됩니다. 저자를 클릭하여 논문 표를 필터링하고, Ctrl 키를 누른 상태에서 클릭하여 여러 저자를 필터링할 수 있습니다. 노드를 드래그하여 순서를 재배열할 수 있습니다.
wikicite.lcn.window.faq.coauthorship.content.p3=각 연결선(엣지)은 핵심 논문 중 두 저자 간의 공동 연구를 나타내며, 연결선의 너비는 핵심 논문의 수를 나타냅니다. 연결선을 클릭하여 논문 표를 필터링할 수 있습니다.
wikicite.lcn.window.faq.coauthorship.header=공동 저자 네트워크를 어떻게 읽어야 하나요?
